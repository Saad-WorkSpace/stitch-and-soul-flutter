<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Stitch &amp; Soul</title>
  <desc id="desc">An editorial banner for a Flutter clothing atelier storefront.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/>
      <stop offset="0.52" stop-color="#F1E7D9"/>
      <stop offset="1" stop-color="#E8D6C3"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4724B"/>
      <stop offset="1" stop-color="#8E5135"/>
    </linearGradient>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2h12M0 8h12M2 0v12M8 0v12" stroke="#1B1A17" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1B1A17" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="420" rx="28" fill="url(#weave)"/>

  <path d="M-30 340C180 245 270 460 495 341S839 194 1230 318" fill="none" stroke="#7A8C73" stroke-width="2" stroke-dasharray="3 10" opacity=".8"/>
  <path d="M-40 366C187 272 301 487 514 369S863 225 1240 339" fill="none" stroke="#B4724B" stroke-width="1.5" opacity=".45"/>

  <g transform="translate(860 44)" filter="url(#shadow)">
    <path d="M92 18c74 13 135 76 143 156 7 70-27 137-88 172L21 271C7 198 18 120 61 55Z" fill="url(#cloth)"/>
    <path d="M92 18c12 53 51 91 107 111M21 271c70-14 126 8 168 57" fill="none" stroke="#F8EFE5" stroke-width="2" stroke-dasharray="5 9" opacity=".72"/>
    <path d="M65 91c38 32 99 46 156 34" fill="none" stroke="#1B1A17" stroke-width="1.5" opacity=".3"/>
    <circle cx="114" cy="174" r="31" fill="#F5EFE6" opacity=".94"/>
    <circle cx="114" cy="174" r="19" fill="none" stroke="#1B1A17" stroke-width="1.5" stroke-dasharray="2 4"/>
    <circle cx="114" cy="174" r="4" fill="#1B1A17"/>
  </g>

  <g transform="translate(82 74)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#B4724B" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5">A ONE-PERSON ATELIER</text>
    <text x="0" y="78" dominant-baseline="hanging" fill="#1B1A17" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" letter-spacing="-2">Stitch &amp; Soul</text>
    <line x1="2" y1="176" x2="624" y2="176" stroke="#1B1A17" stroke-opacity=".22"/>
    <text x="0" y="206" dominant-baseline="hanging" fill="#4C4942" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-style="italic">Garments made slowly, for the long table.</text>
    <text x="0" y="268" dominant-baseline="hanging" fill="#68635B" font-family="Arial, sans-serif" font-size="16" letter-spacing="1.2">FLUTTER · RIVERPOD · EDITORIAL COMMERCE</text>
  </g>

  <g transform="translate(777 340) rotate(-20)">
    <path d="M0 0h98" stroke="#1B1A17" stroke-width="3" stroke-linecap="round"/>
    <path d="M98 0l-17-6v12Z" fill="#1B1A17"/>
    <circle cx="0" cy="0" r="6" fill="#F5EFE6" stroke="#1B1A17" stroke-width="2"/>
  </g>
